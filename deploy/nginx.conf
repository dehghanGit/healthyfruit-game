# Place in /etc/nginx/nginx.conf; change paths and server_name for your server.
user www-data;
worker_processes 1;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 15;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 backlog=2048;
        server_name example.com;
        root /srv/halosi;
        disable_symlinks on from=$document_root;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Replace forwarded headers; do not accept client-supplied proxy chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_buffers 4 16k;
            proxy_buffer_size 8k;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            # Avoid duplicate writes if a response is lost.
            proxy_next_upstream off;
        }
        location = / { try_files /index.html =404; expires -1; }
        location = /index.html { expires -1; }
        location = /admin { try_files /admin.html =404; expires -1; }
        location = /admin/ { try_files /admin.html =404; expires -1; }
        location = /admin.html { expires -1; }
        location ~ ^/(css|js|assets/images)/.+\.(css|js|png|jpg|jpeg|webp|svg|woff|woff2)$ {
            try_files $uri =404;
            expires 1h;
            access_log off;
        }
        location / { return 404; }
    }
}
